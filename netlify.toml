[build]
  command = "npm run check && npm run netlify:check"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "unzipper"]
  included_files = ["output/pdf/**", "config/**", "prompts/**"]

[functions."campaign-runner"]
  # A aplicação reserva internamente somente um lote a cada 15 minutos.
  # A chamada a cada 5 minutos recupera execuções atrasadas ou perdidas sem duplicar envios.
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Pragma = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
